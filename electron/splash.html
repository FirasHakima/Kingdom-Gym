<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080808;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden;position:relative;}
.glow{position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(227,30,36,0.12),transparent 70%);border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.8;}50%{transform:scale(1.1);opacity:1;}}
.logo-wrap{position:relative;width:160px;height:160px;border-radius:28px;background:linear-gradient(135deg,#1a1a1a,#0d0d0d);border:1px solid #2a2a2a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 80px rgba(227,30,36,0.2),0 20px 60px rgba(0,0,0,0.6);margin-bottom:28px;z-index:1;}
.logo-wrap img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(227,30,36,0.4));}
.logo-border{position:absolute;inset:-1px;border-radius:28px;background:linear-gradient(135deg,rgba(227,30,36,0.3),transparent,rgba(227,30,36,0.1));}
h1{font-size:30px;font-weight:900;color:#fff;letter-spacing:5px;text-align:center;line-height:1.1;margin-bottom:6px;z-index:1;}
h1 span{color:#E31E24;}
.sub{font-size:10px;color:#444;letter-spacing:3px;margin-bottom:36px;z-index:1;}
.bar-wrap{width:200px;height:3px;background:#1a1a1a;border-radius:2px;overflow:hidden;z-index:1;}
.bar{height:100%;width:0%;background:linear-gradient(to right,#E31E24,#ff4444);border-radius:2px;animation:load 3.5s ease-in-out forwards;}
@keyframes load{0%{width:0%;}30%{width:40%;}60%{width:70%;}85%{width:90%;}100%{width:100%;}}
.status{font-size:10px;color:#333;margin-top:10px;letter-spacing:1px;z-index:1;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:0.3;}50%{opacity:1;}}
.credits{position:absolute;bottom:16px;font-size:10px;color:#2a2a2a;text-align:center;z-index:1;}
.credits span{color:#E31E24;font-weight:600;}
</style>
</head>
<body>
<div class="glow"></div>
<div class="logo-wrap">
  <img src="BureauIcon.png" alt="Kingdom Gym"/>
  <div class="logo-border"></div>
</div>
<h1>KINGDOM <span>GYM</span></h1>
<div class="sub">SYSTEME DE GESTION</div>
<div class="bar-wrap"><div class="bar"></div></div>
<div class="status">DEMARRAGE EN COURS...</div>
<div class="credits">Created & Powered by <span>Firas Hakima</span></div>
</body>
</html>
